<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘 뭐 먹지</title>
<meta name="description" content="냉장고에 있는 재료로 고르는 오늘의 한 끼. 가진 재료와 먹고 싶은 종류를 고르면 만들 수 있는 요리를 보여줍니다.">
<meta name="theme-color" content="#FFFDF5">
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="96x96" href="./icons/favicon-96.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
<link rel="manifest" href="./site.webmanifest">
<meta name="apple-mobile-web-app-title" content="뭐 먹지">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFDF5;
    --ink:#1F1B16;
    --pine:#1E4D42;
    --pine-soft:#E7EFEA;
    --mustard:#F0A93B;
    --brick:#C8503C;
    --edge:#E2DAC8;
    --muted:#7A7264;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);color:var(--ink);
    font-family:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;
  }
  body.locked{overflow:hidden;}
  .wrap{max-width:960px;margin:0 auto;padding:0 20px 96px;}

  .topbar{border-bottom:2px solid var(--ink);padding:14px 0;display:flex;justify-content:space-between;
    align-items:baseline;gap:12px;font-size:13px;color:var(--muted);}
  .topbar b{font-weight:700;color:var(--ink);}

  .hero{padding:52px 0 38px;}
  .hero h1{font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-weight:400;
    font-size:clamp(56px,14vw,120px);line-height:.92;letter-spacing:-.02em;margin:0;}
  .hero h1 .mark{color:var(--brick);}
  .hero p{max-width:34em;margin:22px 0 0;font-size:17px;color:var(--muted);}

  /* 선택판 */
  .board{border:2px solid var(--ink);border-radius:18px;background:#fff;overflow:hidden;}
  .tray{padding:24px 22px;}
  .tray + .tray{border-top:2px solid var(--ink);}
  .tray h2{font-size:19px;font-weight:700;margin:0 0 4px;}
  .tray .hint{margin:0 0 18px;font-size:14px;color:var(--muted);}

  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .pick{appearance:none;font:inherit;cursor:pointer;background:var(--paper);
    border:1.5px solid var(--edge);border-radius:12px;padding:14px 8px 12px;text-align:center;color:var(--ink);
    transition:background .12s ease,border-color .12s ease,color .12s ease;}
  .pick .icon{display:block;font-size:26px;line-height:1.2;margin-bottom:4px;}
  .pick .label{display:block;font-size:15px;font-weight:500;}
  .pick:hover{border-color:var(--pine);background:var(--pine-soft);}
  .pick:focus-visible{outline:3px solid var(--mustard);outline-offset:2px;}
  .pick[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:#fff;}
  .cuisine .pick{padding:16px 8px;}
  .cuisine .pick .label{font-size:17px;font-weight:700;}
  .cuisine .pick .sub{display:block;font-size:12px;color:var(--muted);margin-top:2px;}
  .cuisine .pick[aria-pressed="true"] .sub{color:rgba(255,255,255,.75);}

  /* 필터 */
  .filters{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
  .filter h3{font-size:14px;font-weight:700;margin:0 0 9px;}
  .chips{display:flex;flex-wrap:wrap;gap:7px;}
  .chip{appearance:none;font:inherit;font-size:14px;cursor:pointer;background:transparent;
    border:1.5px solid var(--edge);border-radius:999px;padding:6px 14px;color:var(--muted);
    transition:background .12s ease,border-color .12s ease,color .12s ease;}
  .chip:hover{border-color:var(--pine);color:var(--pine);}
  .chip:focus-visible{outline:3px solid var(--mustard);outline-offset:2px;}
  .chip[aria-pressed="true"]{background:var(--mustard);border-color:var(--mustard);color:#3D2A08;font-weight:700;}

  .bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:16px 22px;
    background:var(--pine-soft);border-top:2px solid var(--ink);}
  .status{font-size:15px;font-weight:500;flex:1 1 auto;min-width:180px;}
  .status em{font-style:normal;font-weight:700;color:var(--pine);}
  .btn{appearance:none;font:inherit;cursor:pointer;background:var(--ink);color:var(--paper);
    border:none;border-radius:999px;padding:11px 20px;font-size:14px;font-weight:700;}
  .btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink);}
  .btn:focus-visible{outline:3px solid var(--mustard);outline-offset:2px;}

  /* 결과 그리드 */
  .results{margin-top:44px;}
  .results-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
    border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:22px;}
  .results-head h2{font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-weight:400;
    font-size:30px;margin:0;letter-spacing:-.01em;}
  .count{font-size:14px;color:var(--muted);white-space:nowrap;}

  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  .card{appearance:none;font:inherit;text-align:left;cursor:pointer;padding:0;overflow:hidden;
    background:#fff;border:1.5px solid var(--edge);border-radius:16px;color:var(--ink);
    display:flex;flex-direction:column;transition:border-color .12s ease,transform .12s ease;}
  .card:hover{border-color:var(--pine);transform:translateY(-2px);}
  .card:focus-visible{outline:3px solid var(--mustard);outline-offset:2px;}
  .thumb{position:relative;aspect-ratio:4/3;display:grid;place-items:center;border-bottom:1.5px solid var(--edge);}
  .thumb .plate{width:64%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
    background:rgba(255,255,255,.72);box-shadow:inset 0 0 0 6px rgba(255,255,255,.5);}
  .thumb .plate span{font-size:40px;line-height:1;}
  .thumb .badge{position:absolute;left:10px;top:10px;font-size:11px;font-weight:700;
    background:rgba(31,27,22,.82);color:var(--paper);border-radius:999px;padding:3px 9px;}
  .thumb .heat{position:absolute;right:10px;top:10px;font-size:13px;letter-spacing:-2px;}
  .card-body{padding:14px 15px 16px;flex:1;display:flex;flex-direction:column;gap:6px;}
  .card-body h3{font-size:18px;font-weight:700;margin:0;line-height:1.35;}
  .card-body .sub{font-size:13px;color:var(--muted);margin:0;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .card-body .foot{margin-top:auto;padding-top:8px;font-size:12.5px;color:var(--muted);
    display:flex;gap:6px;flex-wrap:wrap;}
  .card-body .foot b{font-weight:500;color:var(--pine);}

  .sectionlabel{font-size:14px;color:var(--muted);margin:30px 0 14px;
    padding-top:14px;border-top:1.5px dashed var(--edge);}
  .empty{border:1.5px dashed var(--edge);border-radius:16px;padding:40px 24px;text-align:center;color:var(--muted);}
  .empty strong{display:block;color:var(--ink);font-size:18px;margin-bottom:6px;}

  /* 상세 */
  .overlay{position:fixed;inset:0;background:rgba(31,27,22,.55);z-index:50;
    display:grid;place-items:center;padding:20px;}
  .overlay[hidden]{display:none;}
  .sheet{background:var(--paper);border:2px solid var(--ink);border-radius:20px;
    width:min(680px,100%);max-height:88vh;overflow:auto;position:relative;}
  .sheet-top{padding:26px 26px 0;}
  .sheet h3{font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-weight:400;
    font-size:34px;margin:0;letter-spacing:-.01em;padding-right:44px;}
  .sheet .desc{margin:8px 0 0;color:var(--muted);}
  .meta{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 0;}
  .tag{font-size:13px;font-weight:500;border:1.5px solid var(--edge);border-radius:999px;
    padding:3px 12px;color:var(--muted);}
  .tag.hot{border-color:var(--mustard);color:#8a5b10;background:#FDF3E0;}
  .cols{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.35fr);gap:28px;padding:24px 26px 30px;}
  .cols h4{font-size:14px;font-weight:700;margin:0 0 10px;padding-bottom:6px;border-bottom:1.5px solid var(--ink);}
  ul.ing{list-style:none;margin:0;padding:0;font-size:15px;}
  ul.ing li{padding:5px 0;border-bottom:1px dashed var(--edge);}
  ol.steps{margin:0;padding-left:1.2em;font-size:15px;}
  ol.steps li{margin-bottom:9px;}
  ol.steps li::marker{font-weight:700;color:var(--pine);}
  .close{position:absolute;right:16px;top:16px;width:36px;height:36px;border-radius:50%;
    border:1.5px solid var(--ink);background:var(--paper);cursor:pointer;font-size:18px;line-height:1;color:var(--ink);}
  .close:focus-visible{outline:3px solid var(--mustard);outline-offset:2px;}

  footer{margin-top:60px;padding-top:18px;border-top:1.5px solid var(--edge);font-size:13px;color:var(--muted);}

  @media (max-width:760px){
    .cards{grid-template-columns:repeat(2,1fr);gap:12px;}
    .thumb .plate span{font-size:32px;}
  }
  @media (max-width:640px){
    .grid,.grid.cuisine{grid-template-columns:repeat(2,1fr);}
    .filters{grid-template-columns:1fr;gap:18px;}
    .cols{grid-template-columns:1fr;gap:22px;padding:20px 18px 26px;}
    .sheet-top{padding:22px 18px 0;}
    .sheet h3{font-size:28px;}
    .tray{padding:20px 16px;}
    .bar{padding:14px 16px;}
    .hero{padding:38px 0 28px;}
    .card-body h3{font-size:16px;}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important;}}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <b>오늘 뭐 먹지</b>
    <span>냉장고에 있는 재료로 고르는 오늘의 한 끼</span>
  </div>

  <header class="hero">
    <h1>오늘<br>뭐 먹지<span class="mark">?</span></h1>
    <p>가진 재료와 먹고 싶은 종류를 고르면 만들 수 있는 요리를 보여드려요. 매운 정도와 걸리는 시간으로도 걸러낼 수 있습니다.</p>
  </header>

  <main class="board">
    <section class="tray">
      <h2>가진 재료</h2>
      <p class="hint">지금 집에 있는 주재료 하나를 고르세요.</p>
      <div class="grid" id="ingGrid"></div>
    </section>

    <section class="tray">
      <h2>먹고 싶은 종류</h2>
      <p class="hint">오늘 입맛에 맞는 카테고리를 고르세요.</p>
      <div class="grid cuisine" id="cuiGrid"></div>
    </section>

    <section class="tray">
      <div class="filters">
        <div class="filter">
          <h3>매운맛</h3>
          <div class="chips" id="spiceChips"></div>
        </div>
        <div class="filter">
          <h3>조리 시간</h3>
          <div class="chips" id="timeChips"></div>
        </div>
      </div>
    </section>

    <div class="bar">
      <div class="status" id="status">재료와 종류를 고르면 요리를 보여드려요.</div>
      <button class="btn ghost" id="randomBtn" type="button">아무거나 골라줘</button>
      <button class="btn" id="resetBtn" type="button">다시 고르기</button>
    </div>
  </main>

  <section class="results" id="results" hidden>
    <div class="results-head">
      <h2 id="resultsTitle">오늘의 추천</h2>
      <span class="count" id="resultsCount"></span>
    </div>
    <div id="mainCards" class="cards"></div>
    <div id="extraWrap" hidden>
      <p class="sectionlabel" id="extraLabel"></p>
      <div id="extraCards" class="cards"></div>
    </div>
    <div id="emptyBox"></div>
  </section>

  <footer>재료가 조금 부족해도 괜찮아요. 양념은 집에 있는 걸로 바꿔 써도 맛은 비슷하게 나옵니다.</footer>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <button class="close" id="closeBtn" type="button" aria-label="닫기">✕</button>
    <div class="sheet-top">
      <h3 id="sheetTitle"></h3>
      <p class="desc" id="sheetDesc"></p>
      <div class="meta" id="sheetMeta"></div>
    </div>
    <div class="cols">
      <div><h4>재료</h4><ul class="ing" id="sheetIng"></ul></div>
      <div><h4>만드는 순서</h4><ol class="steps" id="sheetSteps"></ol></div>
    </div>
  </div>
</div>

<script>
const INGREDIENTS=[
 {id:'빵',icon:'🍞'},{id:'소고기',icon:'🥩'},{id:'돼지고기',icon:'🐖'},{id:'닭고기',icon:'🍗'},
 {id:'계란',icon:'🥚'},{id:'두부',icon:'⬜'},{id:'해산물',icon:'🦐'},{id:'채소',icon:'🥬'},
 {id:'국수',icon:'🍜'},{id:'치즈',icon:'🧀'}
];
const CUISINES=[
 {id:'한식',sub:'익숙하고 든든하게'},{id:'양식',sub:'버터와 토마토'},
 {id:'중식',sub:'센 불에 빠르게'},{id:'일식',sub:'담백하게 한 그릇'}
];
const SPICE_FILTERS=[
 {id:'all',label:'상관없어요'},{id:0,label:'안 매움'},{id:1,label:'조금 매콤'},{id:2,label:'얼큰하게'}
];
const TIME_FILTERS=[
 {id:'all',label:'상관없어요'},{id:20,label:'20분 안에'},{id:35,label:'35분 안에'},{id:60,label:'1시간 안에'}
];
const HEAT=['','🌶','🌶🌶'];
const TINT={한식:'#F6E3DD',양식:'#EFE6D2',중식:'#E9DCE6',일식:'#DFE9E6'};

// R(재료, 종류, 이름, 이모지, 소요분, 난이도, 매운정도0~2, 설명, [재료], [순서])
const R=(ing,cui,name,emoji,min,level,spice,desc,ingredients,steps)=>
  ({ing,cui,name,emoji,min,level,spice,desc,ingredients,steps});

const RECIPES=[
/* ── 빵 ─────────────────────────────── */
R('빵','한식','길거리 토스트','🍳',15,'쉬움',0,'양배추 계란전을 끼운 그 맛. 설탕 한 꼬집이 핵심이에요.',
 ['식빵 2장','계란 2개','양배추 1/8통','당근 조금','설탕 1작은술','버터, 케첩, 마요네즈'],
 ['양배추와 당근을 가늘게 채 썰어 계란과 소금 약간을 넣고 섞습니다.','팬에 버터를 녹이고 식빵 양면을 노릇하게 굽고 꺼냅니다.','같은 팬에 계란 반죽을 식빵 크기로 네모나게 부칩니다.','구운 빵 위에 계란전을 올리고 설탕을 솔솔 뿌립니다.','케첩과 마요네즈를 뿌린 뒤 나머지 빵을 덮어 반으로 자릅니다.']),
R('빵','한식','불고기 샌드위치','🥪',20,'보통',0,'남은 불고기가 있으면 5분이면 끝나는 든든한 한 끼.',
 ['모닝빵 또는 바게트','소고기 불고기감 150g','양파 1/4개','간장 1큰술, 설탕 1작은술, 다진 마늘','상추, 마요네즈'],
 ['소고기에 간장, 설탕, 다진 마늘을 넣고 10분 재웁니다.','팬을 달군 뒤 양파와 함께 국물이 졸아들 때까지 볶습니다.','빵을 반으로 갈라 안쪽 면만 마른 팬에 살짝 굽습니다.','마요네즈를 바르고 상추, 불고기 순으로 올려 덮습니다.']),
R('빵','한식','계란빵','🥧',30,'보통',0,'머핀틀만 있으면 되는 겨울 간식.',
 ['핫케이크가루 1컵','우유 120ml','계란 5개(반죽용 1 + 위에 4)','설탕 1큰술','소금, 후추, 버터'],
 ['핫케이크가루에 우유, 계란 1개, 설탕을 넣고 덩어리 없이 섞습니다.','머핀틀에 버터를 바르고 반죽을 반쯤 채웁니다.','계란을 하나씩 깨 올리고 소금과 후추를 뿌립니다.','180도 오븐에서 20분, 노른자가 살짝 익을 때까지 굽습니다.']),

R('빵','양식','프렌치토스트','🍯',15,'쉬움',0,'딱딱해진 빵을 가장 맛있게 살리는 방법.',
 ['식빵 2장','계란 2개','우유 100ml','설탕 1큰술','버터 1큰술','시나몬가루, 꿀 또는 잼'],
 ['계란, 우유, 설탕을 잘 풀어 넓은 그릇에 붓습니다.','식빵을 담가 양면에 골고루 적십니다. 두꺼운 빵은 2분 정도 둡니다.','약한 불에서 버터를 녹이고 빵을 앞뒤로 3분씩 천천히 굽습니다.','접시에 담고 꿀이나 잼, 시나몬가루를 올립니다.']),
R('빵','양식','크로크무슈','🧀',25,'보통',0,'치즈가 겉까지 흘러나와 바삭하게 익는 프랑스식 토스트.',
 ['식빵 4장','햄 2장','슬라이스 치즈 3장','버터 1큰술, 밀가루 1큰술, 우유 200ml','소금, 후추'],
 ['버터를 녹여 밀가루를 볶다가 우유를 조금씩 부어 걸쭉한 소스를 만듭니다.','소금, 후추로 간하고 불을 끕니다.','빵에 소스를 바르고 햄과 치즈를 넣어 샌드위치를 만듭니다.','윗면에 남은 소스와 치즈를 올려 200도에서 10분 굽습니다.']),
R('빵','양식','마늘 치즈 브레드','🧄',20,'쉬움',0,'바게트 하나로 만드는 술안주 겸 간식.',
 ['바게트 1개','버터 60g','다진 마늘 2큰술','설탕 1큰술, 마요네즈 1큰술','모차렐라 치즈, 파슬리'],

 ['부침가루 1컵, 물 150ml','양배추 1/4통','계란 2개','모짜렐라 치즈 1컵','베이컨 4줄','오코노미 소스, 마요네즈, 가쓰오부시'],
 ['양배추를 가늘게 채 썰어 반죽에 넉넉히 섞습니다.','계란을 넣고 가볍게 섞습니다. 오래 저으면 질겨집니다.','팬에 반죽을 두툼하게 올리고 베이컨을 덮습니다.','한 면당 5분씩 굽고, 뒤집을 때 치즈를 넣습니다.','소스와 마요네즈를 뿌리고 가쓰오부시를 올립니다.']),
R('치즈','일식','치즈 야키 오니기리','🍙',15,'쉬움',0,'구운 주먹밥 표면의 간장 향이 전부입니다.',
 ['밥 2공기','슬라이스 치즈 2장','간장 2큰술, 미림 1큰술','참기름 1큰술','김 조금','통깨'],
 ['간장과 미림을 섞어 발라줄 양념을 만듭니다.','밥을 삼각형으로 단단하게 뭉치고 가운데에 치즈를 넣습니다.','팬에 참기름을 두르고 주먹밥을 한 면당 3분씩 굽습니다.','겉이 단단해지면 붓으로 양념을 발라 다시 30초씩 굽습니다.','통깨를 뿌리고 김을 둘러 냅니다.']),
R('치즈','일식','치즈 돈카츠','🍖',35,'보통',0,'치즈가 새지 않게 고기를 꼼꼼히 여미는 게 관건입니다.',
 ['돼지 등심 2장','슬라이스 치즈 4장','밀가루, 계란, 빵가루','소금, 후추','식용유','돈카츠 소스, 양배추 채'],

];

/* ── 상태 ──────────────────────────── */
let selIng=null, selCui=null, selSpice='all', selTime='all';
const MAX=9;

const ingGrid=document.getElementById('ingGrid');
const cuiGrid=document.getElementById('cuiGrid');
const spiceChips=document.getElementById('spiceChips');
const timeChips=document.getElementById('timeChips');
const statusEl=document.getElementById('status');
const results=document.getElementById('results');
const mainCards=document.getElementById('mainCards');
const extraWrap=document.getElementById('extraWrap');
const extraLabel=document.getElementById('extraLabel');
const extraCards=document.getElementById('extraCards');
const emptyBox=document.getElementById('emptyBox');
const resultsTitle=document.getElementById('resultsTitle');
const resultsCount=document.getElementById('resultsCount');

INGREDIENTS.forEach(it=>{
  const b=document.createElement('button');
  b.type='button';b.className='pick';b.setAttribute('aria-pressed','false');b.dataset.value=it.id;
  b.innerHTML=`<span class="icon" aria-hidden="true">${it.icon}</span><span class="label">${it.id}</span>`;
  b.addEventListener('click',()=>{selIng=(selIng===it.id)?null:it.id;render();});
  ingGrid.appendChild(b);
});
CUISINES.forEach(it=>{
  const b=document.createElement('button');
  b.type='button';b.className='pick';b.setAttribute('aria-pressed','false');b.dataset.value=it.id;
  b.innerHTML=`<span class="label">${it.id}</span><span class="sub">${it.sub}</span>`;
  b.addEventListener('click',()=>{selCui=(selCui===it.id)?null:it.id;render();});
  cuiGrid.appendChild(b);
});
function buildChips(box,list,getter,setter){
  list.forEach(it=>{
    const b=document.createElement('button');
    b.type='button';b.className='chip';b.textContent=it.label;b.dataset.value=String(it.id);
    b.addEventListener('click',()=>{setter(it.id);render();});
    box.appendChild(b);
  });
}
buildChips(spiceChips,SPICE_FILTERS,()=>selSpice,v=>selSpice=v);
buildChips(timeChips,TIME_FILTERS,()=>selTime,v=>selTime=v);

function passFilter(r){
  if(selSpice!=='all' && r.spice!==selSpice) return false;
  if(selTime!=='all' && r.min>selTime) return false;
  return true;
}
function syncControls(){
  ingGrid.querySelectorAll('.pick').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.value===selIng)));
  cuiGrid.querySelectorAll('.pick').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.value===selCui)));
  spiceChips.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.value===String(selSpice))));
  timeChips.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.value===String(selTime))));
}

function cardHTML(r,i,badge){
  return `<button class="card" type="button" data-key="${r.name}">
    <div class="thumb" style="background:${TINT[r.cui]}">
      ${badge?`<span class="badge">${badge}</span>`:''}
      ${r.spice?`<span class="heat" aria-label="매운맛">${HEAT[r.spice]}</span>`:''}
      <div class="plate"><span aria-hidden="true">${r.emoji}</span></div>
    </div>
    <div class="card-body">
      <h3>${r.name}</h3>
      <p class="sub">${r.desc}</p>
      <div class="foot"><b>${r.min}분</b><span>·</span><span>${r.level}</span><span>·</span><span>${r.cui}</span></div>
    </div>
  </button>`;
}
function fillCards(box,list,badgeFn){
  box.innerHTML=list.map((r,i)=>cardHTML(r,i,badgeFn?badgeFn(r):'')).join('');
  box.querySelectorAll('.card').forEach(btn=>{
    btn.addEventListener('click',()=>openSheet(btn.dataset.key));
  });
}

function render(){
  syncControls();
  if(!selIng||!selCui){
    results.hidden=true;
    if(!selIng&&!selCui) statusEl.textContent='재료와 종류를 고르면 요리를 보여드려요.';
    else if(!selCui) statusEl.innerHTML=`<em>${selIng}</em> 선택. 이제 종류를 골라주세요.`;
    else statusEl.innerHTML=`<em>${selCui}</em> 선택. 이제 재료를 골라주세요.`;
    return;
  }
  statusEl.innerHTML=`<em>${selIng}</em> + <em>${selCui}</em>`;
  resultsTitle.textContent=`${selIng}로 만드는 ${selCui}`;

  const exact=RECIPES.filter(r=>r.ing===selIng&&r.cui===selCui&&passFilter(r));
  const used=new Set(exact.map(r=>r.name));
  const near=[];
  if(exact.length<MAX){
    RECIPES.filter(r=>r.ing===selIng&&r.cui!==selCui&&passFilter(r)&&!used.has(r.name))
      .forEach(r=>{if(exact.length+near.length<MAX){near.push(r);used.add(r.name);}});
  }
  if(exact.length+near.length<MAX){
    RECIPES.filter(r=>r.cui===selCui&&r.ing!==selIng&&passFilter(r)&&!used.has(r.name))
      .forEach(r=>{if(exact.length+near.length<MAX){near.push(r);used.add(r.name);}});
  }

  const total=exact.length+near.length;
  resultsCount.textContent=total?`${total}가지`:'';

  fillCards(mainCards,exact);
  mainCards.hidden=exact.length===0;

  if(near.length){
    extraWrap.hidden=false;
    extraLabel.textContent=exact.length
      ? '조건에 가까운 다른 요리도 같이 보여드려요.'
      : '고른 조건에 딱 맞는 요리가 없어서 가까운 요리를 찾아봤어요.';
    fillCards(extraCards,near,r=>r.ing===selIng?r.cui:r.ing);
  }else{
    extraWrap.hidden=true;
  }

  emptyBox.innerHTML = total ? '' :
    `<div class="empty"><strong>조건에 맞는 요리가 없어요.</strong>매운맛이나 시간 조건을 넓혀보세요.</div>`;
  results.hidden=false;
}

/* ── 상세 ─────────────────────────── */
const overlay=document.getElementById('overlay');
let lastFocus=null;
let sheetInHistory=false;
function openSheet(name){
  const r=RECIPES.find(x=>x.name===name);
  if(!r) return;
  lastFocus=document.activeElement;
  document.getElementById('sheetTitle').textContent=r.name;
  document.getElementById('sheetDesc').textContent=r.desc;
  document.getElementById('sheetMeta').innerHTML=
    `<span class="tag hot">${r.cui}</span><span class="tag">${r.ing}</span>`+
    `<span class="tag">${r.min}분</span><span class="tag">난이도 ${r.level}</span>`+
    `<span class="tag">${['안 매움','조금 매콤','얼큰함'][r.spice]}</span>`;
  document.getElementById('sheetIng').innerHTML=r.ingredients.map(i=>`<li>${i}</li>`).join('');
  document.getElementById('sheetSteps').innerHTML=r.steps.map(s=>`<li>${s}</li>`).join('');
  overlay.hidden=false;
  document.body.classList.add('locked');
  document.getElementById('closeBtn').focus();
  if(!sheetInHistory){
    history.pushState({sheet:true},'');
    sheetInHistory=true;
  }
}
/* 실제로 시트를 감춘다 - 히스토리는 건드리지 않는다 */
function hideSheet(){
  overlay.hidden=true;
  document.body.classList.remove('locked');
  if(lastFocus) lastFocus.focus();
}
/* 닫기 버튼 / 배경 탭 / ESC - 뒤로가기와 같은 경로를 타도록 history.back()을 거친다 */
function closeSheet(){
  if(sheetInHistory) history.back();
  else hideSheet();
}
document.getElementById('closeBtn').addEventListener('click',closeSheet);
overlay.addEventListener('click',e=>{if(e.target===overlay) closeSheet();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!overlay.hidden) closeSheet();});
window.addEventListener('popstate',()=>{
  sheetInHistory=false;
  if(!overlay.hidden) hideSheet();
});

document.getElementById('resetBtn').addEventListener('click',()=>{
  selIng=null;selCui=null;selSpice='all';selTime='all';render();
  window.scrollTo({top:0,behavior:'smooth'});
});
document.getElementById('randomBtn').addEventListener('click',()=>{
  const pool=RECIPES.filter(passFilter);
  const pick=(pool.length?pool:RECIPES)[Math.floor(Math.random()*(pool.length||RECIPES.length))];
  selIng=pick.ing;selCui=pick.cui;render();
  results.scrollIntoView({behavior:'smooth',block:'start'});
});

render();
</script>
</body>
</html>
